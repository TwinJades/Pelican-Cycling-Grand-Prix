<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑车 by gemini-3.8-flash</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0f7ff 0%, #e0effe 50%, #fef3c7 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 980px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.8);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #0284c7, #0369a1, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 13px;
      font-weight: 700;
      border-radius: 9999px;
      border: 1px solid #bae6fd;
    }

    .artboard {
      width: 100%;
      aspect-ratio: 16 / 10;
      max-height: 560px;
      border-radius: 20px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04), 0 10px 30px -5px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 动效控制 */
    @keyframes rotateWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pedalRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes bikeBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(-0.5deg); }
      50% { transform: translateY(1px) rotate(0.4deg); }
      75% { transform: translateY(-2px) rotate(-0.2deg); }
    }

    @keyframes windMove {
      0% { transform: translateX(1100px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateX(-200px); opacity: 0; }
    }

    @keyframes cloudDrift {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-1200px); }
    }

    @keyframes fishWiggle {
      0%, 100% { transform: rotate(-18deg) translate(0, 0); }
      50% { transform: rotate(-25deg) translate(-2px, -3px); }
    }

    .spin-wheel {
      transform-origin: center;
      animation: rotateWheel 1.2s linear infinite;
    }

    .spin-pedal {
      transform-origin: 470px 440px;
      animation: pedalRotate 1.2s linear infinite;
    }

    .bob-rider {
      animation: bikeBob 0.6s ease-in-out infinite;
      transform-origin: 470px 440px;
    }

    .fish-tail {
      animation: fishWiggle 0.45s ease-in-out infinite;
      transform-origin: 685px 172px;
    }

    .wind-line-1 { animation: windMove 2.4s linear infinite; }
    .wind-line-2 { animation: windMove 3.1s linear infinite 0.9s; }
    .wind-line-3 { animation: windMove 2s linear infinite 0.4s; }

    .clouds-layer {
      animation: cloudDrift 45s linear infinite;
    }

    .paused * {
      animation-play-state: paused !important;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    .btn-primary:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    footer {
      font-size: 13px;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>

      <div class="badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        Created by gemini-3.8-flash
      </div>
    </header>

    <div class="artboard" id="artboard">
      <svg id="pelicanSvg" viewBox="0 0 1000 625" xmlns="http://www.w3.org/2000/svg">
        <defs>

              <line x1="0" y1="-64" x2="0" y2="64" stroke="#94a3b8" stroke-width="1.8"/>

              <line x1="-25" y1="-59" x2="25" y2="59" stroke="#94a3b8" stroke-width="1.5"/>
              <line x1="-59" y1="25" x2="59" y2="-25" stroke="#94a3b8" stroke-width="1.5"/>

          <!-- 喉囊里露出来的小鱼尾巴（正在摆动） -->

        <!-- 前景野花装饰 -->

    <div class="toolbar">
      <button class="btn-primary" id="toggleBtn" onclick="toggleAnimation()">
        <svg id="toggleIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        <span id="toggleText">暂停动画</span>
      </button>
      <button class="btn-secondary" onclick="downloadSvg()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        导出 SVG 文件
      </button>
    </div>

    <footer>
      画面特点：手绘质感矢量插画 · 标志性大喉囊 · 车轮辐条飞转 · 蹬车曲柄与起伏体态 · 调皮晃脑的小鱼
    </footer>
  </div>

  <script>
    let isPlaying = true;
    const artboard = document.getElementById('artboard');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleText = document.getElementById('toggleText');
    const toggleIcon = document.getElementById('toggleIcon');

    function toggleAnimation() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        artboard.classList.remove('paused');
        toggleText.textContent = '暂停动画';
        toggleIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        artboard.classList.add('paused');
        toggleText.textContent = '播放动画';
        toggleIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function downloadSvg() {
      const svgData = document.getElementById('pelicanSvg').outerHTML;
      const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
      const svgUrl = URL.createObjectURL(svgBlob);
      const downloadLink = document.createElement("a");
      downloadLink.href = svgUrl;
      downloadLink.download = "鹈鹕骑车 by gemini-3.8-flash.svg";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }
  </script>
</body>
