      place-items: center;

    .poster {

      position: relative;
      overflow: hidden;
      background: var(--cream);
      box-shadow: 0 24px 80px #071a2280;

    .pedal { transform-box: fill-box; transform-origin: center; animation: spin 1.9s linear infinite; }
    .bird { transform-box: fill-box; transform-origin: 50% 90%; animation: bob 0.95s ease-in-out infinite alternate; }
    .scarf-tail { transform-box: fill-box; transform-origin: 100% 50%; animation: flutter 0.7s ease-in-out infinite alternate; }
    .wave { animation: shimmer 2.8s ease-in-out infinite alternate; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { to { transform: translateX(80px); } }
    @keyframes bob { to { transform: translateY(-5px) rotate(-0.35deg); } }
    @keyframes flutter { to { transform: rotate(5deg) scaleX(.94); } }
    @keyframes shimmer { to { opacity: .45; transform: translateX(9px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
