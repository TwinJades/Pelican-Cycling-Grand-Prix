  <style>
    :root { color-scheme: light; }

    .cloud { animation: drift 16s ease-in-out infinite alternate; }
    .cloud.two { animation-delay: -8s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 50% { transform: translateY(-7px) rotate(-.4deg); } }
    @keyframes drift { to { transform: translateX(38px); } }
    @media (prefers-reduced-motion: reduce) { .wheel,.rider,.cloud { animation: none; } }
