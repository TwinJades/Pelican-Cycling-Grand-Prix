<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(180deg, #87CEEB 0%, #E0F4FF 58%, #98D4A3 58%, #7BC47F 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; font-family: KaiTi, STKaiti, serif; overflow: hidden;
  }
  h1 { color: #2a5f8f; font-size: 2rem; margin-bottom: 6px; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
  .credit { color: #555; font-size: 0.9rem; margin-top: 8px; font-style: italic; }
  #cloud1 { animation: dc1 12s ease-in-out infinite; }
  #cloud2 { animation: dc2 18s ease-in-out infinite; }
  @keyframes dc1 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(30px)} }
  @keyframes dc2 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-20px)} }
  #backWheel  { animation: spin 0.6s linear infinite; transform-origin: 170px 295px; }
  #frontWheel { animation: spin 0.6s linear infinite; transform-origin: 360px 295px; }
  #crank      { animation: spin 0.6s linear infinite; transform-origin: 262px 270px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #bike    { animation: bounce 0.3s ease-in-out infinite alternate; }
  #pelican { animation: bounce 0.3s ease-in-out infinite alternate; }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-5px)} }
  #wing  { animation: flap 0.55s ease-in-out infinite alternate; transform-origin: 215px 135px; }
  @keyframes flap { from{transform:rotate(0deg)} to{transform:rotate(-25deg)} }
  #crest { animation: wave 1.1s ease-in-out infinite alternate; transform-origin: 265px 26px; }
  @keyframes wave { from{transform:rotate(-6deg)} to{transform:rotate(6deg)} }
  #sunRays { animation: spinSlow 8s linear infinite; transform-origin: 430px 60px; }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  #pouch { animation: pulse 0.6s ease-in-out infinite alternate; transform-origin: 290px 68px; }
  @keyframes pulse { from{transform:scale(1)} to{transform:scale(1.08)} }
  #speedLines { animation: whoosh 0.45s linear infinite; }
  @keyframes whoosh { from{transform:translateX(18px);opacity:.7} to{transform:translateX(-8px);opacity:0} }
</style>
</head>
<body>
<h1>🦢 鹈鹕骑车 🚲</h1>
<svg width="500" height="420" viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun -->
  <circle cx="430" cy="60" r="40" fill="#FFD700" opacity="0.9"/>
  <g id="sunRays" stroke="#FFD700" stroke-width="3" opacity="0.7">
    <line x1="430" y1="10" x2="430" y2="0"/><line x1="430" y1="110" x2="430" y2="122"/>
    <line x1="378" y1="60" x2="368" y2="60"/><line x1="482" y1="60" x2="492" y2="60"/>
    <line x1="393" y1="23" x2="386" y2="16"/><line x1="467" y1="97" x2="474" y2="104"/>
    <line x1="393" y1="97" x2="386" y2="104"/><line x1="467" y1="23" x2="474" y2="16"/>
  </g>
  <!-- Clouds -->
  <g id="cloud1" opacity="0.9">
    <ellipse cx="80" cy="70" rx="45" ry="25" fill="white"/>
    <ellipse cx="110" cy="55" rx="35" ry="22" fill="white"/>
    <ellipse cx="55" cy="58" rx="28" ry="18" fill="white"/>
  </g>
  <g id="cloud2" opacity="0.75">
    <ellipse cx="270" cy="50" rx="38" ry="20" fill="white"/>
    <ellipse cx="295" cy="38" rx="28" ry="18" fill="white"/>
    <ellipse cx="248" cy="40" rx="22" ry="15" fill="white"/>
  </g>
  <!-- Birds -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <path d="M60,120 Q67,115 74,120"/><path d="M150,90 Q157,85 164,90"/><path d="M190,105 Q196,101 202,105"/>
  </g>
  <!-- Road -->
  <rect x="0" y="310" width="500" height="12" fill="#8B7355" rx="2"/>
  <g stroke="white" stroke-width="3" stroke-dasharray="30,20" opacity="0.5"><line x1="0" y1="316" x2="500" y2="316"/></g>
  <!-- Grass -->
  <g stroke="#5A8F3C" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="322" x2="25" y2="308"/><line x1="36" y1="322" x2="39" y2="307"/><line x1="42" y1="322" x2="45" y2="310"/>
    <line x1="418" y1="322" x2="413" y2="308"/><line x1="424" y1="322" x2="427" y2="307"/><line x1="430" y1="322" x2="433" y2="310"/>
  </g>
  <!-- Flowers left -->
  <g transform="translate(28,320)">
    <circle cx="0" cy="-5" r="3" fill="#FFE066"/>
    <circle cx="0" cy="0" r="5" fill="#FFB7C5"/><circle cx="8" cy="-2" r="4" fill="#FFB7C5"/>
    <circle cx="4" cy="-8" r="4" fill="#FFB7C5"/><circle cx="-4" cy="-8" r="4" fill="#FFB7C5"/>
    <circle cx="-8" cy="-2" r="4" fill="#FFB7C5"/>
    <line x1="0" y1="0" x2="0" y2="14" stroke="#5A8F3C" stroke-width="2"/>
  </g>
  <!-- Flowers right -->
  <g transform="translate(458,320)">
    <circle cx="0" cy="-5" r="3" fill="#FFE066"/>
    <circle cx="0" cy="0" r="5" fill="#B8E0FF"/><circle cx="8" cy="-2" r="4" fill="#B8E0FF"/>
    <circle cx="4" cy="-8" r="4" fill="#B8E0FF"/><circle cx="-4" cy="-8" r="4" fill="#B8E0FF"/>
    <circle cx="-8" cy="-2" r="4" fill="#B8E0FF"/>
    <line x1="0" y1="0" x2="0" y2="14" stroke="#5A8F3C" stroke-width="2"/>
  </g>
  <!-- Speed lines -->
  <g id="speedLines" stroke="#AAD4F0" stroke-width="3" stroke-linecap="round">
    <line x1="55" y1="258" x2="98" y2="258"/>
    <line x1="40" y1="276" x2="88" y2="276"/>
    <line x1="50" y1="294" x2="92" y2="294"/>
  </g>
  <!-- BICYCLE -->
  <g id="bike">
    <g id="backWheel">
      <circle cx="170" cy="295" r="65" fill="none" stroke="#333" stroke-width="7"/>
      <g stroke="#666" stroke-width="2.5" opacity="0.8">
        <line x1="170" y1="230" x2="170" y2="360"/><line x1="105" y1="295" x2="235" y2="295"/>
        <line x1="124" y1="249" x2="216" y2="341"/><line x1="124" y1="341" x2="216" y2="249"/>
        <line x1="108" y1="270" x2="232" y2="320"/><line x1="108" y1="320" x2="232" y2="270"/>
      </g>
      <circle cx="170" cy="295" r="10" fill="#333"/>
    </g>
    <g id="frontWheel">
      <circle cx="360" cy="295" r="65" fill="none" stroke="#333" stroke-width="7"/>
      <g stroke="#666" stroke-width="2.5" opacity="0.8">
        <line x1="360" y1="230" x2="360" y2="360"/><line x1="295" y1="295" x2="425" y2="295"/>
        <line x1="314" y1="249" x2="406" y2="341"/><line x1="314" y1="341" x2="406" y2="249"/>
        <line x1="298" y1="270" x2="422" y2="320"/><line x1="298" y1="320" x2="422" y2="270"/>
      </g>
      <circle cx="360" cy="295" r="10" fill="#333"/>
    </g>
    <!-- Frame -->
    <line x1="170" y1="295" x2="262" y2="270" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
    <line x1="170" y1="295" x2="240" y2="185" stroke="#E63946" stroke-width="7" stroke-linecap="round"/>
    <line x1="240" y1="185" x2="262" y2="270" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
    <line x1="262" y1="270" x2="320" y2="185" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
    <line x1="240" y1="185" x2="320" y2="185" stroke="#E63946" stroke-width="7" stroke-linecap="round"/>
    <line x1="320" y1="185" x2="360" y2="295" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
    <!-- Chain ring -->
    <circle cx="262" cy="270" r="28" fill="none" stroke="#888" stroke-width="4" opacity="0.6"/>
    <circle cx="262" cy="270" r="14" fill="#333"/>
    <!-- Crank (spinning) -->
    <g id="crank">
      <line x1="262" y1="270" x2="290" y2="250" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <line x1="262" y1="270" x2="234" y2="290" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <rect x="286" y="243" width="20" height="8" rx="3" fill="#222" transform="rotate(-15,296,247)"/>
      <rect x="218" y="286" width="20" height="8" rx="3" fill="#222" transform="rotate(-15,228,290)"/>
    </g>
    <!-- Seat -->
    <line x1="245" y1="186" x2="245" y2="155" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <path d="M220,148 Q245,138 270,148 Q260,158 230,158 Z" fill="#222" stroke="#111" stroke-width="2"/>
    <!-- Handlebar -->
    <line x1="318" y1="186" x2="318" y2="155" stroke="#555" stroke-width="7" stroke-linecap="round"/>
    <path d="M295,155 Q318,148 342,155" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
    <!-- Bell -->
    <circle cx="340" cy="148" r="7" fill="#F4D03F" stroke="#D4AC0D" stroke-width="1.5"/>
    <!-- Front light -->
    <ellipse cx="355" cy="215" rx="8" ry="6" fill="#FFFACD" stroke="#DAA520" stroke-width="1.5"/>
    <path d="M363,212 Q376,210 381,215 Q376,220 363,218 Z" fill="#FFFACD" opacity="0.5"/>
  </g>
  <!-- PELICAN -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="260" cy="145" rx="52" ry="38" fill="#F5F0E8" stroke="#DDD0B8" stroke-width="2"/>
    <g stroke="#C8BAA0" stroke-width="1.5" opacity="0.7">
      <path d="M215,145 Q235,155 255,148" fill="none"/>
      <path d="M218,155 Q238,163 258,156" fill="none"/>
      <path d="M222,164 Q240,170 258,164" fill="none"/>
    </g>
    <!-- Neck -->
    <path d="M262,108 Q268,88 272,72 Q276,58 270,50" fill="none" stroke="#F0EBE0" stroke-width="18" stroke-linecap="round"/>
    <path d="M262,108 Q268,88 272,72 Q276,58 270,50" fill="none" stroke="#DDD0B8" stroke-width="2"/>
    <!-- Head -->
    <ellipse cx="268" cy="46" rx="24" ry="20" fill="#F5F0E8" stroke="#DDD0B8" stroke-width="2"/>
    <!-- Beak -->
    <path d="M278,42 Q310,38 330,42 Q322,50 278,52 Z" fill="#F4A836" stroke="#D4881A" stroke-width="1.5"/>
    <path d="M327,42 Q336,44 330,52 L322,50 Z" fill="#D4881A"/>
    <!-- Pouch (pulsing) -->
    <path id="pouch" d="M278,52 Q295,68 305,80 Q295,88 278,78 Q268,68 278,52 Z" fill="#F4A836" opacity="0.85" stroke="#D4881A" stroke-width="1.5"/>
    <!-- Eye -->
    <circle cx="276" cy="41" r="6" fill="#1A1A2E"/>
    <circle cx="278" cy="39" r="2.5" fill="white"/>
    <!-- Eyebrow -->
    <path d="M271,34 Q276,30 282,33" fill="none" stroke="#C8A870" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Crest (waving) -->
    <g id="crest" fill="#E8D5A0" stroke="#C8AA70" stroke-width="1">
      <path d="M258,28 Q262,10 268,8 Q266,20 270,26"/>
      <path d="M264,26 Q272,6 278,7 Q272,18 274,24"/>
      <path d="M252,30 Q254,14 260,12 Q258,24 264,28"/>
    </g>
    <!-- Wing (flapping) -->
    <g id="wing">
      <path d="M215,135 Q185,110 160,98 Q150,95 148,102 Q155,108 165,115 Q185,125 210,148 Z" fill="#F5F0E8" stroke="#DDD0B8" stroke-width="2"/>
    </g>
    <!-- Legs -->
    <path d="M242,178 Q238,200 234,220" fill="none" stroke="#F0C070" stroke-width="6" stroke-linecap="round"/>
    <path d="M234,220 Q228,228 220,225 Q226,232 235,230 Q240,228 240,222" fill="#F0C070" stroke="#D4A850" stroke-width="1.5"/>
    <path d="M278,178 Q282,200 288,218" fill="none" stroke="#F0C070" stroke-width="6" stroke-linecap="round"/>
    <path d="M288,218 Q296,226 304,222 Q298,230 289,228 Q284,226 284,220" fill="#F0C070" stroke="#D4A850" stroke-width="1.5"/>
    <ellipse cx="222" cy="226" rx="14" ry="7" fill="#F0C070" stroke="#D4A850" stroke-width="1.5"/>
    <ellipse cx="300" cy="222" rx="14" ry="7" fill="#F0C070" stroke="#D4A850" stroke-width="1.5"/>
  </g>
</svg>
<p class="credit">by claude-sonnet-4-6</p>
</body>
</html>
